# Intelligent Tracker - Default Clean Base Configuration
# Clean non-demo runtime defaults without pre-seeded demo zones, tripwires, or alerting rules.

video:
  source: synthetic
  resolution: [640, 480]
  framerate: 30
  buffer_size: 1
  auto_reconnect: true

detector:
  model: mock
  confidence: 0.25
  classes: ["person", "backpack", "handbag", "suitcase"]

tracker:
  type: sort
  max_disappeared: 30
  min_hits: 3
  iou_threshold: 0.3
  high_conf_threshold: 0.4
  low_conf_threshold: 0.1
  max_distance: 120.0

database:
  path: "data/tracker.db"

reid:
  model: "dual"
  threshold: 0.65

analytics:
  heatmap:
    enabled: true
    decay: 0.998

visualization:
  draw_zones: true
  draw_tripwires: true
  draw_tracks: true
  draw_hud: true
