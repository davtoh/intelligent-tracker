name: CI/CD Pipeline

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install ruff sphinx sphinx-rtd-theme

      - name: Run Ruff Linter
        run: |
          ruff check . --ignore E501,E722,E741,F401,F841 || true

      - name: Run Automated Test Suite
        env:
          MPLBACKEND: "Agg"
        run: |
          python -m unittest discover tests

      - name: Build Sphinx Documentation
        run: |
          sphinx-build -b html documentation/ documentation/_build/html

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build AMD64 Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.amd64
          push: false
          tags: intelligent-tracker:test
