    <!-- TAB 3: SIGHTING TIMELINE PLAYER -->
    <section class="tab-pane" id="tab-timeline" role="tabpanel">
      <div class="timeline-wrapper">
        <!-- Timeline Filter Bar -->
        <div class="glass-panel toolbar-panel">
          <div class="filter-row">
            <div class="filter-item">
              <label for="timeline-entity-select">Entity:</label>
              <select id="timeline-entity-select">
                <option value="">All Entities</option>
              </select>
            </div>
            <div class="filter-item">
              <label for="timeline-zone-select">Zone:</label>
              <select id="timeline-zone-select">
                <option value="">All Zones</option>
              </select>
            </div>
            <div class="filter-item">
              <label for="timeline-source-select">Source:</label>
              <select id="timeline-source-select">
                <option value="">All Sources</option>
              </select>
            </div>
            <div class="filter-item">
              <label for="timeline-limit-select">Limit:</label>
              <select id="timeline-limit-select">
                <option value="25">25 records</option>
                <option value="50" selected>50 records</option>
                <option value="100">100 records</option>
              </select>
            </div>
            <button class="btn btn-primary" id="btn-filter-sightings">
              🔍 Search Sightings
            </button>
            <button type="button" class="btn btn-outline" id="btn-reset-timeline-filters" title="Reset all timeline filters and time window">
              ↺ Reset
            </button>
            <span class="panel-badge" id="timeline-active-window-chip" style="display:none;"></span>
          </div>
        </div>

        <!-- Chronological Timeline Stream -->
        <div class="timeline-stream-container">
          <div class="timeline-stream" id="sightings-timeline-list">
            <div class="empty-state">Select filters to search sighting audit trail.</div>
          </div>
          <div class="timeline-pagination-bar" id="timeline-pagination-bar" style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid var(--border-subtle, rgba(255,255,255,0.08));">
            <button type="button" class="btn btn-sm btn-outline" id="timeline-prev-btn" disabled>Previous</button>
            <span class="text-subtle" id="timeline-page-info">Page 1 of 1</span>
            <button type="button" class="btn btn-sm btn-outline" id="timeline-next-btn" disabled>Next</button>
          </div>
        </div>
      </div>
    </section>
