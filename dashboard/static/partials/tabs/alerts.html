    <!-- TAB 5: SECURITY ALERTS LOG -->
    <section class="tab-pane" id="tab-alerts" role="tabpanel">
      <div class="glass-panel alerts-table-card">
        <div class="card-header">
          <h3>Security & Alert Audit History</h3>
          <span class="panel-badge" id="total-alerts-count">0 events</span>
        </div>
        <div class="alerts-filter-bar" id="alerts-filter-bar" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border-subtle, rgba(255,255,255,0.08));">
          <select id="alerts-filter-camera" class="form-input" aria-label="Filter by camera" style="max-width:160px;">
            <option value="">All Cameras</option>
          </select>
          <select id="alerts-filter-severity" class="form-input" aria-label="Filter by severity" style="max-width:140px;">
            <option value="">All Severities</option>
            <option value="critical">Critical</option>
            <option value="warning">Warning</option>
            <option value="info">Info</option>
          </select>
          <select id="alerts-filter-min-severity" class="form-input" aria-label="Filter by minimum severity" style="max-width:140px;">
            <option value="">Min: All</option>
            <option value="warning">Warning+</option>
            <option value="critical">Critical</option>
          </select>
          <input type="text" id="alerts-filter-type" class="form-input" list="alerts-type-options" placeholder="Type (e.g. dwell, intrusion)..." title="Substring or comma-separated event types" aria-label="Filter by event type" style="max-width:170px;" />
          <datalist id="alerts-type-options"></datalist>
          <input type="text" id="alerts-filter-zone" class="form-input" list="alerts-zone-options" placeholder="Zone (e.g. lobby, vault)..." title="Substring or comma-separated zone names" aria-label="Filter by zone" style="max-width:165px;" />
          <datalist id="alerts-zone-options"></datalist>
          <button type="button" class="btn btn-sm btn-primary" id="alerts-filter-apply">Apply</button>
          <button type="button" class="btn btn-sm btn-outline" id="alerts-filter-reset">Reset</button>
          <div class="alerts-admin-toolbar" id="alerts-admin-toolbar">
            <label style="display: inline-flex; align-items: center; gap: 4px; font-size: 12px; cursor: pointer;">
              <input type="checkbox" id="alerts-select-all-matching" />
              <span>Select All Matching</span>
            </label>
            <button type="button" class="btn btn-sm btn-outline" id="btn-alerts-ack-selected">✓ Ack Selected</button>
            <button type="button" class="btn btn-sm btn-outline" id="btn-alerts-delete-selected">🗑 Delete Selected</button>
            <button type="button" class="btn btn-sm btn-outline" id="btn-alerts-mark-all-read">✓ Mark All Seen</button>
            <button type="button" class="btn btn-sm btn-outline" id="btn-alerts-bulk-clear">🗑 Clear Matching</button>
            <button type="button" class="btn btn-sm btn-outline" id="btn-alerts-export-csv">⬇ Export CSV</button>
            <button type="button" class="btn btn-sm btn-outline" id="btn-alerts-export-json">⬇ Export JSON</button>
          </div>
        </div>
        <div class="table-responsive">
          <table class="data-table" id="alerts-table">
            <thead>
              <tr>
                <th style="width: 32px;"><input type="checkbox" id="alerts-select-all" aria-label="Select all visible alerts" /></th>
                <th>Timestamp</th>
                <th>Type</th>
                <th>Severity</th>
                <th>Zone / Source</th>
                <th>Entity / Track</th>
                <th>Details</th>
                <th>Snapshot</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="alerts-table-body">
              <tr>
                <td colspan="9" class="text-center">No alerts recorded in current session.</td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="alerts-pagination-bar" id="alerts-pagination-bar" style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid var(--border-subtle, rgba(255,255,255,0.08));">
          <button type="button" class="btn btn-sm btn-outline" id="alerts-prev-btn" disabled>Previous</button>
          <span class="text-subtle" id="alerts-page-info">Page 1 of 1</span>
          <button type="button" class="btn btn-sm btn-outline" id="alerts-next-btn" disabled>Next</button>
        </div>
      </div>
      <details class="glass-panel alerts-rules-panel" id="alerts-rules-panel" style="margin-top:12px;padding:12px 16px;">
        <summary style="cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:600;">
          <span>Alert Promotion Rules &amp; Default Policy</span>
          <span class="panel-badge" id="alert-rules-count">0 rules</span>
          <span class="text-subtle" id="alert-policy-status" style="margin-left:auto;font-size:12px;">Default: All</span>
        </summary>
        <div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--border-subtle, rgba(255,255,255,0.08));">
          <input type="text" id="alert-rule-name" class="form-input" placeholder="Rule name..." aria-label="Rule name" style="max-width:160px;" />
          <input type="text" id="alert-rule-event-type" class="form-input" list="alerts-type-options" placeholder="Event type (e.g. zone_dwell)" aria-label="Rule event type" style="max-width:170px;" />
          <input type="text" id="alert-rule-zone" class="form-input" list="alerts-zone-options" placeholder="Zone (e.g. vault)" aria-label="Rule zone" style="max-width:140px;" />
          <input type="number" id="alert-rule-min-dwell" class="form-input" min="0" step="0.5" placeholder="Min dwell (s)" aria-label="Minimum dwell seconds" style="max-width:120px;" />
          <select id="alert-rule-severity" class="form-input" aria-label="Target severity" style="max-width:120px;">
            <option value="warning">Warning</option>
            <option value="critical">Critical</option>
          </select>
          <input type="text" id="alert-rule-tags" class="form-input" placeholder="Tags (comma-sep)" aria-label="Additional tags" style="max-width:140px;" />
          <button type="button" class="btn btn-sm btn-primary" id="btn-alert-rule-add">+ Add Rule</button>
          <button type="button" class="btn btn-sm btn-outline" id="btn-alerts-save-policy" title="Persist current Min Severity filter as default policy">Save Min-Severity Policy</button>
        </div>
        <div id="alert-rules-list" style="margin-top:8px;">
          <div class="text-subtle" style="padding:8px 0;">No custom alert promotion rules configured.</div>
        </div>
      </details>
    </section>
