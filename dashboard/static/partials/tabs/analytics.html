    <!-- TAB 4: ANALYTICS & HEATMAP -->
    <section class="tab-pane" id="tab-analytics" role="tabpanel">
      <div class="analytics-grid">
        <!-- Entry / Exit Chart -->
        <div class="glass-panel chart-card">
          <div class="card-header">
            <h3>Entry & Exit Traffic Flows</h3>
            <div class="analytics-flow-controls">
              <select id="analytics-source-select" class="form-control form-control-sm" aria-label="Analytics Source">
                <option value="">All Sources</option>
              </select>
              <select id="analytics-zone-select" class="form-control form-control-sm" aria-label="Analytics Zone">
                <option value="">All Zones</option>
              </select>
              <select id="analytics-event-type-select" class="form-control form-control-sm" aria-label="Analytics Event Type">
                <option value="">All Events</option>
                <option value="zone_enter">Zone Enter</option>
                <option value="zone_exit">Zone Exit</option>
                <option value="tripwire_cross">Tripwire Cross</option>
                <option value="sighting">Sightings</option>
              </select>
              <select id="analytics-range-select" class="form-control form-control-sm" aria-label="Traffic Flow Range">
                <option value="900">15m</option>
                <option value="3600" selected>1h</option>
                <option value="21600">6h</option>
                <option value="86400">24h</option>
                <option value="604800">7d</option>
              </select>
              <button class="btn btn-sm btn-outline" id="btn-analytics-prev" title="Previous window">‹ Prev</button>
              <button class="btn btn-sm btn-outline" id="btn-analytics-next" title="Next window" disabled>Next ›</button>
              <button class="btn btn-sm btn-primary" id="btn-analytics-live" title="Return to live polling" disabled>Back to Live</button>
            </div>
          </div>
          <div class="analytics-window-bar">
            <span class="panel-badge analytics-window-label" id="analytics-window-label">Live · Last 1h</span>
            <span class="panel-badge analytics-window-label" id="analytics-bucket-page-summary">Buckets: 0</span>
          </div>
          <div class="chart-wrapper">
            <canvas id="trafficChart"></canvas>
          </div>
        </div>

        <!-- Spatial Heatmap Viewer -->
        <div class="glass-panel heatmap-card">
          <div class="card-header">
            <h3>Cumulative Spatial Density Heatmap</h3>
            <div class="heatmap-actions">
              <span class="panel-badge" id="heatmap-camera-badge">All Cameras</span>
              <button class="btn btn-sm btn-outline" id="btn-refresh-heatmap">🔄 Refresh Heatmap</button>
              <a class="btn btn-sm btn-secondary" id="btn-download-heatmap" href="/analytics/heatmap" target="_blank">📥
                Export High-Res</a>
            </div>
          </div>
          <div class="heatmap-viewport heatmap-viewport-grid">
            <div class="heatmap-axis-y" id="heatmap-axis-y" aria-hidden="true"></div>
            <div class="heatmap-stage-wrap" id="heatmap-stage-wrap">
              <img id="static-heatmap-img" data-src="/analytics/heatmap" alt="Accumulated Density Heatmap" />
              <canvas id="heatmap-hotspot-canvas" aria-label="Heatmap hotspot grid"></canvas>
              <div class="heatmap-hotspot-tooltip" id="heatmap-hotspot-tooltip" hidden></div>
            </div>
            <div class="heatmap-axis-spacer" aria-hidden="true"></div>
            <div class="heatmap-axis-x" id="heatmap-axis-x" aria-hidden="true"></div>
          </div>
          <div class="heatmap-legend" id="heatmap-colorbar-legend">
            <span class="heatmap-legend-tick" id="heatmap-legend-min">0.00</span>
            <span class="heatmap-colorbar" aria-hidden="true"></span>
            <span class="heatmap-legend-tick" id="heatmap-legend-mid">0.50</span>
            <span class="heatmap-legend-tick" id="heatmap-legend-max">1.00</span>
          </div>
          <div class="heatmap-meta-summary" id="heatmap-meta-summary">Awaiting heatmap metadata…</div>
        </div>
      </div>
    </section>
