[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent_tracker"
version = "0.1.2"
description = "Intelligent multi-camera computer vision tracking, analytics, and world-state engine"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
authors = [
    { name = "David Toro", email = "davsamirtor@gmail.com" },
]
keywords = ["tracker", "object", "face", "color", "shape", "recognition", "computer-vision"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "packaging>=16.8",
    "appdirs>=1.4",
    "numpy>=1.9",
    "matplotlib>=1.4",
    "combomethod>=1.0",
    "ordered-set>=2.0.2",
    "scipy>=1.1.0",
    "scikit-learn",
    "opencv-contrib-python>=3.4",
    "sympy",
    "psutil>=5.8.0",
    "onnxruntime>=1.18.0",
    "pyyaml>=6.0.0",
    "paho-mqtt>=2.0.0",
    "requests>=2.28.0",
    "python-telegram-bot>=20.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://github.com/davtoh/InteligentTracker"

[project.scripts]
intelligent-tracker = "intelligent_tracker.cli:main"
intelligent-tracker-server = "dashboard.server:main"
intelligent-tracker-ctl = "intelligent_tracker.cli.ctl:main"

[tool.setuptools.packages.find]
include = ["intelligent_tracker*", "dashboard*"]

